name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ── Python Backend Tests ──────────────────────────────────────
  test-backend:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"
        cache-dependency-path: backtester/requirements*.txt
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backtester/requirements.txt
        pip install pytest pytest-cov
        
    - name: Run Tests
      run: |
        PYTHONPATH=. pytest backtester/tests/ -v --cov=backtester --cov-report=term-missing

  # ── Flutter Desktop Analysis ──────────────────────────────────
  analyze-flutter:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: stable
        
    - name: Install dependencies
      working-directory: flutter_app
      run: flutter pub get
      
    - name: Analyze
      working-directory: flutter_app
      run: flutter analyze --no-fatal-infos
