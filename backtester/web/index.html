<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Backtester Chart</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #131722;
            overflow: hidden;
            display: flex;
            height: 100vh;
            width: 100vw;
        }
        #chart-container {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
        }
        #custom-canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 2;
            pointer-events: none; /* clicks pass through to chart */
        }
    </style>
</head>
<body>
    <div id="chart-container"></div>
    <canvas id="custom-canvas"></canvas>

    <!-- Lightweight Charts Standalone (local — run setup to download) -->
    <script src="assets/js/lightweight-charts.standalone.production.js"></script>

    <script>
    // ────────────────────────────────────────────────────────────
    // 1. Chart setup (Lightweight Charts)
    // ────────────────────────────────────────────────────────────
    const chartContainer = document.getElementById('chart-container');

    const chart = LightweightCharts.createChart(chartContainer, {
        layout: {
            background: { type: 'solid', color: '#131722' },
            textColor: '#D9D9D9',
        },
        grid: {
            vertLines: { color: '#2B2B43' },
            horzLines: { color: '#2B2B43' },
        },
        crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
        timeScale: {
            borderColor: '#2B2B43',
            timeVisible: true,
            secondsVisible: false,
        },
    });

    const candleSeries = chart.addCandlestickSeries({
        upColor: '#26a69a', downColor: '#ef5350',
        borderVisible: false,
        wickUpColor: '#26a69a', wickDownColor: '#ef5350',
    });
    // Scale candles to top 75% of the pane
    chart.priceScale('right').applyOptions({
        scaleMargins: { top: 0.05, bottom: 0.25 },
    });

    const volumeSeries = chart.addHistogramSeries({
        color: '#26a69a',
        priceFormat: { type: 'volume' },
        priceScaleId: 'volume',
    });
    chart.priceScale('volume').applyOptions({
        scaleMargins: { top: 0.80, bottom: 0 },
        visible: false,   // Don't show volume price axis — just the bars
    });

    const equitySeries = chart.addLineSeries({
        color: '#2196F3',
        lineWidth: 1,
        priceScaleId: 'equity',
        title: 'Equity',
    });
    chart.priceScale('equity').applyOptions({
        scaleMargins: { top: 0.82, bottom: 0 },
        visible: true,
    });

    // ────────────────────────────────────────────────────────────
    // 2. Canvas overlay (custom indicators)
    // ────────────────────────────────────────────────────────────
    const canvas = document.getElementById('custom-canvas');
    const ctx = canvas.getContext('2d');

    const _tradeMarkers = [];   // { time, entry, exit, pnl }
    const _equityData = [];     // { time, value }
    const _candleData = [];     // { time, open, high, low, close, volume }

    function resizeAll() {
        const w = chartContainer.clientWidth;
        const h = chartContainer.clientHeight;
        canvas.width = w; canvas.height = h;
        chart.resize(w, h);
        _redrawCanvas();
    }
    window.addEventListener('resize', resizeAll);
    resizeAll();

    // Redraw custom overlays whenever the visible range changes
    chart.timeScale().subscribeVisibleLogicalRangeChange(_redrawCanvas);
    chart.subscribeCrosshairMove(_redrawCanvas);

    function _redrawCanvas() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        _drawTradeLines();
    }

    function _drawTradeLines() {
        _tradeMarkers.forEach(m => {
            const x1 = chart.timeScale().timeToCoordinate(m.entryTime);
            const x2 = chart.timeScale().timeToCoordinate(m.exitTime);
            const y1 = candleSeries.priceToCoordinate(m.entryPrice);
            const y2 = candleSeries.priceToCoordinate(m.exitPrice);
            if (x1 === null || x2 === null || y1 === null || y2 === null) return;

            const color = m.pnl >= 0 ? 'rgba(38,166,154,0.7)' : 'rgba(239,83,80,0.7)';
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.strokeStyle = color;
            ctx.lineWidth = 1.5;
            ctx.setLineDash([4, 3]);
            ctx.stroke();
            ctx.setLineDash([]);
        });
    }

    // ────────────────────────────────────────────────────────────
    // 3. JS Bridge — called by Flutter via executeScript()
    // ────────────────────────────────────────────────────────────

    let currentFormula = 'ohlc'; // 'ohlc' | 'heikin_ashi' | 'renko'
    let currentBrickSize = 10;
    const _rawCandles = []; // Store raw data for recalculation on formula switch
    let _haPrev = null;
    let _renkoLastBrick = null;
    const _indicatorSeries = {}; // Map of key -> lineSeries
    const _indicatorColors = ['#F23645', '#2962FF', '#FF9800', '#00BCD4', '#9C27B0'];

    /** Apply selected formula to a single raw candle (for Heikin Ashi) */
    function _applyFormula(rawCandle, isFirst) {
        if (currentFormula === 'heikin_ashi') {
            if (isFirst || !_haPrev) {
                _haPrev = {
                    time: rawCandle.time,
                    open: (rawCandle.open + rawCandle.close) / 2,
                    close: (rawCandle.open + rawCandle.high + rawCandle.low + rawCandle.close) / 4,
                    high: rawCandle.high,
                    low: rawCandle.low
                };
                return _haPrev;
            }
            const haClose = (rawCandle.open + rawCandle.high + rawCandle.low + rawCandle.close) / 4;
            const haOpen = (_haPrev.open + _haPrev.close) / 2;
            const haHigh = Math.max(rawCandle.high, haOpen, haClose);
            const haLow = Math.min(rawCandle.low, haOpen, haClose);

            _haPrev = { time: rawCandle.time, open: haOpen, high: haHigh, low: haLow, close: haClose };
            return _haPrev;
        }
        return rawCandle;
    }

    /** Calculate Renko bricks from raw candles.
     *  @param candles   Raw OHLCV candles.
     *  @param brickSize Brick size in price units.
     *  @param prevBrick Previous last brick (for incremental mode). If null, starts fresh.
     *  @returns { bricks, lastBrick } so the caller can persist state.
     */
    function _calculateRenko(candles, brickSize, prevBrick = null) {
        if (!candles || candles.length === 0) return { bricks: [], lastBrick: prevBrick };
        const renkoBricks = [];
        let lastBrick = prevBrick;

        for (let i = 0; i < candles.length; i++) {
            const raw = candles[i];
            if (!lastBrick) {
                lastBrick = {
                    time: raw.time,
                    open: raw.close,
                    close: raw.close,
                    high: raw.close,
                    low: raw.close,
                    trend: 0
                };
                continue;
            }

            let diff = raw.close - lastBrick.close;
            let bricksToForm = 0;
            let direction = 0;

            if (lastBrick.trend >= 0 && diff >= brickSize) {
                bricksToForm = Math.floor(diff / brickSize);
                direction = 1;
            } else if (lastBrick.trend <= 0 && -diff >= brickSize) {
                bricksToForm = Math.floor(-diff / brickSize);
                direction = -1;
            } else if (lastBrick.trend > 0 && -diff >= brickSize * 2) {
                bricksToForm = Math.floor((-diff) / brickSize);
                direction = -1;
            } else if (lastBrick.trend < 0 && diff >= brickSize * 2) {
                bricksToForm = Math.floor(diff / brickSize);
                direction = 1;
            }

            for (let b = 0; b < bricksToForm; b++) {
                const newClose = lastBrick.close + (direction * brickSize);
                const newOpen = lastBrick.close;
                const newBrick = {
                    time: raw.time + (b * 1),  // each brick gets a unique timestamp offset (+1s)
                    open: newOpen,
                    close: newClose,
                    high: Math.max(newOpen, newClose),
                    low: Math.min(newOpen, newClose),
                    trend: direction
                };
                renkoBricks.push(newBrick);
                lastBrick = newBrick;
            }
        }
        return { bricks: renkoBricks, lastBrick };
    }

    window.setChartFormula = function(formula, config) {
        currentFormula = formula;
        if (config && config.brickSize) currentBrickSize = config.brickSize;
        _haPrev = null;
        _renkoLastBrick = null;
        _candleData.length = 0;

        if (_rawCandles.length > 0) {
            if (currentFormula === 'renko') {
                const { bricks, lastBrick } = _calculateRenko(_rawCandles, currentBrickSize);
                _renkoLastBrick = lastBrick;
                _candleData.push(...bricks);
                candleSeries.setData(bricks);
            } else {
                const transformed = _rawCandles.map((c, i) => _applyFormula(c, i === 0));
                _candleData.push(...transformed);
                candleSeries.setData(transformed);
            }
        }
    };

    window.initIndicators = function(keys) {
        keys.forEach((key, i) => {
            if (!_indicatorSeries[key]) {
                const color = _indicatorColors[i % _indicatorColors.length];
                _indicatorSeries[key] = chart.addLineSeries({
                    color: color,
                    lineWidth: 2,
                    priceScaleId: 'right',
                    title: key.toUpperCase(),
                });
            }
        });
    };

    window.addCandle = function(data) {
        _rawCandles.push(data);

        // Volume bar
        const isUp = data.close >= data.open;
        volumeSeries.update({
            time: data.time,
            value: data.volume,
            color: isUp ? 'rgba(38,166,154,0.5)' : 'rgba(239,83,80,0.5)',
        });

        if (currentFormula === 'renko') {
            // Incremental: pass current lastBrick so state is preserved
            const { bricks, lastBrick } = _calculateRenko([data], currentBrickSize, _renkoLastBrick);
            _renkoLastBrick = lastBrick;
            if (bricks.length > 0) {
                bricks.forEach(b => {
                    _candleData.push(b);
                    candleSeries.update(b);
                });
            }
        } else {
            const displayData = _applyFormula(data, _rawCandles.length === 1);
            _candleData.push(displayData);
            candleSeries.update(displayData);
        }

        if (data.indicators) {
            Object.keys(data.indicators).forEach(key => {
                if (_indicatorSeries[key] && data.indicators[key] !== null) {
                    _indicatorSeries[key].update({ time: data.time, value: data.indicators[key] });
                }
            });
        }
    };

    window.setCandles = function(dataArray) {
        _rawCandles.length = 0;
        _rawCandles.push(...dataArray);
        _candleData.length = 0;
        _haPrev = null;
        _renkoLastBrick = null;

        if (currentFormula === 'renko') {
            const { bricks, lastBrick } = _calculateRenko(_rawCandles, currentBrickSize);
            _renkoLastBrick = lastBrick;
            _candleData.push(...bricks);
            candleSeries.setData(bricks);
        } else {
            const displayData = _rawCandles.map((c, i) => _applyFormula(c, i === 0));
            _candleData.push(...displayData);
            candleSeries.setData(displayData);
        }

        // Volume
        const volData = dataArray.map(c => ({
            time: c.time,
            value: c.volume,
            color: c.close >= c.open ? 'rgba(38,166,154,0.5)' : 'rgba(239,83,80,0.5)',
        }));
        volumeSeries.setData(volData);

        // Indicators
        const indData = {};
        dataArray.forEach(c => {
            if (c.indicators) {
                Object.keys(c.indicators).forEach(k => {
                    if (!indData[k]) indData[k] = [];
                    if (c.indicators[k] !== null) {
                        indData[k].push({ time: c.time, value: c.indicators[k] });
                    }
                });
            }
        });
        Object.keys(indData).forEach(k => {
            if (_indicatorSeries[k]) {
                _indicatorSeries[k].setData(indData[k]);
            }
        });
    };

    /** Add an equity curve point. */
    window.addEquityPoint = function(data) {
        _equityData.push({ time: data.time, value: data.value });
        equitySeries.update({ time: data.time, value: data.value });
    };

    /** Add a trade entry/exit line overlay on the canvas. */
    window.addTradeMarker = function(data) {
        _tradeMarkers.push({
            entryTime: data.entry_time,
            exitTime: data.exit_time,
            entryPrice: data.entry_price,
            exitPrice: data.exit_price,
            pnl: data.pnl,
        });
        // Also add Lightweight Charts markers at entry/exit
        const existing = candleSeries.markers() || [];
        candleSeries.setMarkers([
            ...existing,
            { time: data.entry_time, position: 'belowBar', color: '#26a69a', shape: 'arrowUp', text: 'B' },
            { time: data.exit_time, position: 'aboveBar', color: data.pnl >= 0 ? '#26a69a' : '#ef5350', shape: 'arrowDown', text: 'S' },
        ]);
        _redrawCanvas();
    };

    /** Clear all series and overlay data. */
    window.clearChart = function() {
        _rawCandles.length = 0;
        _candleData.length = 0;
        _equityData.length = 0;
        _tradeMarkers.length = 0;
        _haPrev = null;
        _renkoLastBrick = null;
        candleSeries.setData([]);
        equitySeries.setData([]);
        volumeSeries.setData([]);
        candleSeries.setMarkers([]);

        Object.values(_indicatorSeries).forEach(series => chart.removeSeries(series));
        for (const key in _indicatorSeries) delete _indicatorSeries[key];

        ctx.clearRect(0, 0, canvas.width, canvas.height);
    };

    // ── Custom indicator examples ──────────────────────────────

    /** Draw a liquidity heatmap via Canvas.
     *  heatmapData: [{ time, priceLow, priceHigh, intensity }]
     */
    window.drawLiquidityHeatmap = function(heatmapData) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        heatmapData.forEach(box => {
            const x = chart.timeScale().timeToCoordinate(box.time);
            if (x === null) return;
            const yTop = candleSeries.priceToCoordinate(box.priceHigh);
            const yBot = candleSeries.priceToCoordinate(box.priceLow);
            if (yTop === null || yBot === null) return;
            ctx.fillStyle = `rgba(255,160,0,${Math.min(1, Math.max(0, box.intensity))})`;
            ctx.fillRect(x - 10, yTop, 20, yBot - yTop);
        });
    };

    </script>
</body>
</html>
