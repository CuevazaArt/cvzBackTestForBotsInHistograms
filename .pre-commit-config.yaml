# .pre-commit-config.yaml
#
# Install once with `pre-commit install` (creates .git/hooks/pre-commit).
# Run on demand with `pre-commit run --all-files`.
#
# Versions are pinned for reproducibility; bump them deliberately and re-run
# `pre-commit run --all-files` to surface any new findings.

default_language_version:
  python: python3.12

default_stages: [pre-commit]

# Skip auto-generated / vendored / build outputs.
exclude: |
  (?x)^(
    flutter_app/(build|\.dart_tool|windows/flutter/ephemeral)/.*|
    backtester/web/assets/js/lightweight-charts.standalone.production\.js|
    backtester/data/.*|
    backtester/results/.*|
    .*\.min\.(js|css)
  )$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
        args: ["--allow-multiple-documents"]
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: ["--markdown-linebreak-ext=md"]
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=750"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        name: ruff (lint --fix)
        args: ["--fix", "--exit-non-zero-on-fix"]
        files: ^backtester/.*\.py$
      - id: ruff-format
        name: ruff format
        files: ^backtester/.*\.py$

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        name: mypy (backtester)
        files: ^backtester/.*\.py$
        args: ["--ignore-missing-imports", "--no-strict-optional"]
        additional_dependencies:
          - types-requests
