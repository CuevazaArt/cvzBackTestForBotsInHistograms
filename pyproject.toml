[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cvz-backtester"
version = "0.6.0"
description = "Mini MetaTrader-style backtester for crypto trading bots with realistic fills, walk-forward, Monte Carlo, and a declarative strategy DSL."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "cvz" },
]
keywords = [
    "backtesting",
    "trading",
    "crypto",
    "binance",
    "quant",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Office/Business :: Financial :: Investment",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "cryptography>=41,<43",
    "requests>=2.31,<3",
    "rich>=13.7,<14",
    "duckdb>=1.0,<2",
    "pandas>=2.2,<3",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.9,<3",
    "websockets>=13,<14",
    "httpx>=0.27,<1",
    "pyyaml>=6,<7",
    "jinja2>=3.1,<4",
]

[project.optional-dependencies]
optimize = [
    "optuna>=4,<5",
    "nevergrad>=1,<2",
]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=1,<2",
    "pytest-cov>=5,<6",
    "ruff>=0.6",
    "mypy>=1.10",
]
test = [
    "hypothesis>=6,<7",
    "pytest-benchmark>=4,<5",
]

[project.scripts]
cvz-backtester = "backtester.main:main"

[project.urls]
Homepage = "https://github.com/cvz/backtester"
Issues = "https://github.com/cvz/backtester/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["backtester*"]
exclude = ["flutter_app*", "tests*", "tools*", "tests_e2e*"]

[tool.setuptools.package-data]
"backtester" = ["**/*.html", "**/*.css", "**/*.js", "web/**/*"]
