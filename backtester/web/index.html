<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pecunator Backtest View</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #131722; /* TradingView Dark Theme */
            overflow: hidden;
            display: flex;
            height: 100vh;
            width: 100vw;
        }
        
        #chart-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1; /* Fondo: Lightweight Charts */
        }

        #custom-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2; /* Frente: Canvas superpuesto */
            pointer-events: none; /* Dejar pasar los clicks al chart */
        }
    </style>
</head>
<body>
    <div id="chart-container"></div>
    <canvas id="custom-canvas"></canvas>

    <!-- Lightweight Charts Standalone (local — download with setup script) -->
    <script src="assets/js/lightweight-charts.standalone.production.js"></script>
    
    <script>
        // 1. Setup Lightweight Charts
        const chartContainer = document.getElementById('chart-container');
        const chart = LightweightCharts.createChart(chartContainer, {
            width: chartContainer.clientWidth,
            height: chartContainer.clientHeight,
            layout: {
                background: { type: 'solid', color: '#131722' },
                textColor: '#D9D9D9',
            },
            grid: {
                vertLines: { color: '#2B2B43' },
                horzLines: { color: '#2B2B43' },
            },
            crosshair: {
                mode: LightweightCharts.CrosshairMode.Normal,
            },
            timeScale: {
                borderColor: '#2B2B43',
                timeVisible: true,
                secondsVisible: false,
            },
        });

        const candlestickSeries = chart.addCandlestickSeries({
            upColor: '#26a69a',
            downColor: '#ef5350',
            borderVisible: false,
            wickUpColor: '#26a69a',
            wickDownColor: '#ef5350',
        });

        // 2. Setup Custom Canvas Overlay
        const canvas = document.getElementById('custom-canvas');
        const ctx = canvas.getContext('2d');
        
        function resizeCanvas() {
            canvas.width = chartContainer.clientWidth;
            canvas.height = chartContainer.clientHeight;
            chart.resize(canvas.width, canvas.height);
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // 3. Sincronización de Coordenadas
        // Flutter llamará a setCandles(data) y drawCustomIndicator(points)
        
        window.setCandles = (data) => {
            candlestickSeries.setData(data);
        };

        window.updateCrosshair = (param) => {
            if (param.point) {
                // Aquí Flutter puede escuchar el crosshair o podemos dibujar el heatmap de liquidez
                // en base a param.time y param.point.y
            }
        };

        chart.subscribeCrosshairMove(window.updateCrosshair);
        
        // 4. API para "Indicadores Raros" (Llamada desde Flutter/Python)
        window.drawLiquidityHeatmap = (heatmapData) => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            // heatmapData: [{ time, priceLow, priceHigh, intensity }, ...]
            
            heatmapData.forEach(box => {
                const x = chart.timeScale().timeToCoordinate(box.time);
                if (x === null) return;
                
                const yTop = candlestickSeries.priceToCoordinate(box.priceHigh);
                const yBottom = candlestickSeries.priceToCoordinate(box.priceLow);
                if (yTop === null || yBottom === null) return;
                
                // Color mapping basado en intensidad
                ctx.fillStyle = `rgba(255, 100, 0, ${box.intensity})`;
                ctx.fillRect(x, yTop, 20, yBottom - yTop);
            });
        };

        // Redibujar canvas si el chart hace pan/zoom
        chart.timeScale().subscribeVisibleLogicalRangeChange(() => {
            // Requiere redibujar todo en base a las coordenadas actuales
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            // requestAnimationFrame(redrawRareIndicators);
        });
    </script>
</body>
</html>
