<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Backtester Chart</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #131722;
            overflow: hidden;
            display: flex;
            height: 100vh;
            width: 100vw;
        }
        #chart-container {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
        }
        #custom-canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 2;
            pointer-events: none; /* clicks pass through to chart */
        }
    </style>
</head>
<body>
    <div id="chart-container"></div>
    <canvas id="custom-canvas"></canvas>

    <!-- Lightweight Charts Standalone (local — run setup to download) -->
    <script src="assets/js/lightweight-charts.standalone.production.js"></script>

    <script>
    // ────────────────────────────────────────────────────────────
    // 1. Chart setup (Lightweight Charts)
    // ────────────────────────────────────────────────────────────
    const chartContainer = document.getElementById('chart-container');

    const chart = LightweightCharts.createChart(chartContainer, {
        layout: {
            background: { type: 'solid', color: '#131722' },
            textColor: '#D9D9D9',
        },
        grid: {
            vertLines: { color: '#2B2B43' },
            horzLines: { color: '#2B2B43' },
        },
        crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
        timeScale: {
            borderColor: '#2B2B43',
            timeVisible: true,
            secondsVisible: false,
        },
    });

    const candleSeries = chart.addCandlestickSeries({
        upColor: '#26a69a', downColor: '#ef5350',
        borderVisible: false,
        wickUpColor: '#26a69a', wickDownColor: '#ef5350',
    });

    const equitySeries = chart.addLineSeries({
        color: '#2196F3',
        lineWidth: 1,
        priceScaleId: 'equity',
        title: 'Equity',
    });
    chart.priceScale('equity').applyOptions({
        scaleMargins: { top: 0.8, bottom: 0 },
        visible: true,
    });

    // ────────────────────────────────────────────────────────────
    // 2. Canvas overlay (custom indicators)
    // ────────────────────────────────────────────────────────────
    const canvas = document.getElementById('custom-canvas');
    const ctx = canvas.getContext('2d');

    const _tradeMarkers = [];   // { time, entry, exit, pnl }
    const _equityData = [];     // { time, value }
    const _candleData = [];     // { time, open, high, low, close, volume }

    function resizeAll() {
        const w = chartContainer.clientWidth;
        const h = chartContainer.clientHeight;
        canvas.width = w; canvas.height = h;
        chart.resize(w, h);
        _redrawCanvas();
    }
    window.addEventListener('resize', resizeAll);
    resizeAll();

    // Redraw custom overlays whenever the visible range changes
    chart.timeScale().subscribeVisibleLogicalRangeChange(_redrawCanvas);
    chart.subscribeCrosshairMove(_redrawCanvas);

    function _redrawCanvas() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        _drawTradeLines();
    }

    function _drawTradeLines() {
        _tradeMarkers.forEach(m => {
            const x1 = chart.timeScale().timeToCoordinate(m.entryTime);
            const x2 = chart.timeScale().timeToCoordinate(m.exitTime);
            const y1 = candleSeries.priceToCoordinate(m.entryPrice);
            const y2 = candleSeries.priceToCoordinate(m.exitPrice);
            if (x1 === null || x2 === null || y1 === null || y2 === null) return;

            const color = m.pnl >= 0 ? 'rgba(38,166,154,0.7)' : 'rgba(239,83,80,0.7)';
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.strokeStyle = color;
            ctx.lineWidth = 1.5;
            ctx.setLineDash([4, 3]);
            ctx.stroke();
            ctx.setLineDash([]);
        });
    }

    // ────────────────────────────────────────────────────────────
    // 3. JS Bridge — called by Flutter via executeScript()
    // ────────────────────────────────────────────────────────────

    /** Add one OHLCV candle (streaming, bar by bar). */
    window.addCandle = function(data) {
        _candleData.push(data);
        candleSeries.update(data);
    };

    /** Bulk-load an array of candles (initial load). */
    window.setCandles = function(dataArray) {
        _candleData.length = 0;
        _candleData.push(...dataArray);
        candleSeries.setData(dataArray);
    };

    /** Add an equity curve point. */
    window.addEquityPoint = function(data) {
        _equityData.push({ time: data.time, value: data.value });
        equitySeries.update({ time: data.time, value: data.value });
    };

    /** Add a trade entry/exit line overlay on the canvas. */
    window.addTradeMarker = function(data) {
        _tradeMarkers.push({
            entryTime: data.entry_time,
            exitTime: data.exit_time,
            entryPrice: data.entry_price,
            exitPrice: data.exit_price,
            pnl: data.pnl,
        });
        // Also add Lightweight Charts markers at entry/exit
        const existing = candleSeries.markers() || [];
        candleSeries.setMarkers([
            ...existing,
            { time: data.entry_time, position: 'belowBar', color: '#26a69a', shape: 'arrowUp', text: 'B' },
            { time: data.exit_time, position: 'aboveBar', color: data.pnl >= 0 ? '#26a69a' : '#ef5350', shape: 'arrowDown', text: 'S' },
        ]);
        _redrawCanvas();
    };

    /** Clear all series and overlay data. */
    window.clearChart = function() {
        _candleData.length = 0;
        _equityData.length = 0;
        _tradeMarkers.length = 0;
        candleSeries.setData([]);
        equitySeries.setData([]);
        candleSeries.setMarkers([]);
        ctx.clearRect(0, 0, canvas.width, canvas.height);
    };

    // ── Custom indicator examples ──────────────────────────────

    /** Draw a liquidity heatmap via Canvas.
     *  heatmapData: [{ time, priceLow, priceHigh, intensity }]
     */
    window.drawLiquidityHeatmap = function(heatmapData) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        heatmapData.forEach(box => {
            const x = chart.timeScale().timeToCoordinate(box.time);
            if (x === null) return;
            const yTop = candleSeries.priceToCoordinate(box.priceHigh);
            const yBot = candleSeries.priceToCoordinate(box.priceLow);
            if (yTop === null || yBot === null) return;
            ctx.fillStyle = `rgba(255,160,0,${Math.min(1, Math.max(0, box.intensity))})`;
            ctx.fillRect(x - 10, yTop, 20, yBot - yTop);
        });
    };

    </script>
</body>
</html>
