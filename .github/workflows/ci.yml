name: CI

on:
  push:
    branches: [ "main", "claude/**", "feature/**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Python Lint (ruff) ─────────────────────────────────────────
  lint-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install ruff
        run: pip install ruff==0.6.9
      - name: Ruff check
        run: ruff check backtester/ --output-format=github
      - name: Ruff format check
        run: ruff format --check backtester/

  # ── Python Type Check (mypy) ───────────────────────────────────
  typecheck-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backtester/requirements*.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backtester/requirements.txt
          pip install mypy==1.11.2 types-requests
      - name: Mypy
        run: mypy backtester --ignore-missing-imports --no-strict-optional

  # ── Python Backend Tests ───────────────────────────────────────
  test-backend:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: backtester/requirements*.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backtester/requirements.txt
          pip install -r backtester/requirements-optimize.txt
          pip install pytest pytest-cov pytest-asyncio
      - name: Run Tests
        shell: bash
        env:
          PYTHONPATH: .
        run: |
          pytest backtester/tests/ -v \
            --cov=backtester \
            --cov-report=term-missing \
            --cov-report=xml \
            --junitxml=pytest-report.xml
      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-${{ matrix.os }}-py${{ matrix.python-version }}
          path: pytest-report.xml

  # ── Flutter Desktop Analysis + Tests ───────────────────────────
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        working-directory: flutter_app
        run: flutter pub get
      - name: Analyze
        working-directory: flutter_app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Test
        working-directory: flutter_app
        run: flutter test --reporter=expanded

  # ── Aggregate gate ─────────────────────────────────────────────
  # Required for branch protection. flutter promoted to required after B5
  # migrated widget tests to fakeAsync + cancellable Timer in home_screen.
  ci-gate:
    needs: [lint-backend, typecheck-backend, test-backend, flutter]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Verify required jobs succeeded
        run: |
          if [ "${{ needs.lint-backend.result }}" != "success" ] || \
             [ "${{ needs.typecheck-backend.result }}" != "success" ] || \
             [ "${{ needs.test-backend.result }}" != "success" ] || \
             [ "${{ needs.flutter.result }}" != "success" ]; then
            echo "One or more required jobs failed"
            exit 1
          fi
          echo "All required CI checks passed"
