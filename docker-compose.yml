# docker-compose.yml — local dev / smoke test stack for cvz-backtester.
#
# Usage:
#   docker compose up --build         # boots FastAPI on http://localhost:8002
#   docker compose exec backend \
#       python -m pytest backtester/tests/ -q   # run tests inside the image
#   docker compose down               # stop and remove containers
#
# The .env file is optional and only loaded if present (Binance creds, ports,
# log level, etc.). It is git-ignored — do NOT commit secrets.

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: cvz-backtester:local
    container_name: cvz-backtester-backend
    restart: unless-stopped
    ports:
      - "8002:8002"
    env_file:
      - path: .env
        required: false
    environment:
      PYTHONUNBUFFERED: "1"
      BACKTESTER_DATA_DIR: /app/backtester/data
    volumes:
      # SQLite store + cached candles persist across container restarts.
      - ./backtester/data:/app/backtester/data
      # Optional: persist HTML report exports / experiment outputs.
      - ./backtester/results:/app/backtester/results
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8002/healthz', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
