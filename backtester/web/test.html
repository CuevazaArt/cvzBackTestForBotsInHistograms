<!DOCTYPE html>
<html><head><meta charset="UTF-8"></head>
<body style="margin:0;padding:0;">
  <div id="c" style="width:600px;height:400px;background:#131722;"></div>
  <div id="log" style="color:white;font-family:monospace;padding:10px;background:#000;font-size:12px;"></div>
  <script src="assets/js/lightweight-charts.standalone.production.js"></script>
  <script>
    var log = (m) => { document.getElementById('log').innerHTML += m + '<br>'; if(window.chrome&&window.chrome.webview&&window.chrome.webview.postMessage){ window.chrome.webview.postMessage('test:'+m); } };
    try {
      log('LightweightCharts type: ' + typeof LightweightCharts);
      log('createChart type: ' + typeof LightweightCharts.createChart);
      log('version: ' + LightweightCharts.version());
      const chart = LightweightCharts.createChart(document.getElementById('c'));
      log('chart type: ' + typeof chart);
      log('chart.addCandlestickSeries type: ' + typeof chart.addCandlestickSeries);
      log('chart proto methods: ' + Object.getOwnPropertyNames(Object.getPrototypeOf(chart)).slice(0,15).join(','));
      const s = chart.addCandlestickSeries();
      log('series created: ' + (s ? 'YES' : 'NO'));
      s.setData([
        {time:'2024-01-01', open:100, high:110, low:95, close:105},
        {time:'2024-01-02', open:105, high:115, low:100, close:108},
        {time:'2024-01-03', open:108, high:112, low:103, close:110},
      ]);
      log('data set OK');
    } catch(e) {
      log('ERROR: ' + e.message + ' | stack: ' + (e.stack || 'no-stack').split('\n')[0]);
    }
  </script>
</body></html>
