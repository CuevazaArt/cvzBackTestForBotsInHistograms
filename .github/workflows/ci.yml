name: CI

on:
  push:
    branches: [ "main", "claude/**", "feature/**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Flutter Desktop: analyze + unit tests ──────────────────────
  flutter-analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        working-directory: app
        run: flutter pub get
      - name: Analyze
        working-directory: app
        run: flutter analyze --no-fatal-infos
      - name: Test
        working-directory: app
        run: flutter test --reporter=expanded

  # ── Flutter Desktop: Windows build smoke ───────────────────────
  flutter-build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        working-directory: app
        run: flutter pub get
      - name: Build Windows (release)
        working-directory: app
        run: flutter build windows --release
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cvz-backtester-windows
          path: app/build/windows/x64/runner/Release/

  # ── Aggregate gate ─────────────────────────────────────────────
  # Required for branch protection.
  ci-gate:
    needs: [flutter-analyze-test, flutter-build-windows]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Verify required jobs succeeded
        run: |
          if [ "${{ needs.flutter-analyze-test.result }}" != "success" ] || \
             [ "${{ needs.flutter-build-windows.result }}" != "success" ]; then
            echo "One or more required jobs failed"
            exit 1
          fi
          echo "All required CI checks passed"
